---
scrape_configs:
  - job_name: snmp
    scrape_interval: 2m
    scrape_timeout: 60s
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/switches.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: rcs-snmp-exporter:9116
