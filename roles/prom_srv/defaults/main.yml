prom_srv_instance: "rcs"
prom_srv_name: "{{ prom_srv_instance }}-prometheus"
prom_srv_network: "{{ prom_srv_name }}"
prom_srv_dir: "/srv/{{ prom_srv_instance }}-prometheus"
prom_srv_image: "docker.io/prom/prometheus:v3.13.2"
prom_srv_hostbind: "127.0.0.1"
prom_srv_port_ext: "9090"
prom_srv_port_int: "9090"
prom_srv_ports:
  - "{{ prom_srv_hostbind }}:{{ prom_srv_port_ext }}:{{ prom_srv_port_int }}"
prom_srv_retention: 180d
prom_srv_max_size: 400GB
# if need emergency repair set: prom_srv_extra_flags:"--web.enable-admin-api"
prom_srv_extra_flags: ""

# Config
# Dicts merge (recursive), lists replace.
prom_srv_cfg_global_def:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    prometheus: "{{ inventory_hostname }}"
  sample_limit: 20000
  label_limit: 30
  label_name_length_limit: 128
  label_value_length_limit: 512

prom_srv_cfg_global_extra: {}

prom_srv_cfg_scrape_configs:
  - prometheus.yml
  - snmp.yml
  - node.yml
prom_srv_cfg_rules: []
prom_srv_cfg_targets:
  - switches.json
  - nodes.json
# minimal: bare targets/scrape configs, no labels or per-kind params beyond
# exporter/job defaults. with-label-schema: the device/role/service/location/kind
# schema and per-job param resolution (label-schema.md). Set prom_srv_cfg_set to
# switch both at once; override either one independently only if you need them to
# diverge.
prom_srv_cfg_set: minimal
prom_srv_cfg_target_set: "{{ prom_srv_cfg_set }}"
prom_srv_cfg_scrape_config_set: "{{ prom_srv_cfg_set }}"

# Per-device label resolution (label-schema.md §8 interim inventory).
# Precedence, low to high: prom_srv_cfg_kind_defaults < prom_srv_cfg_service_defaults
# < a node_sets entry's own fields < a set member's inline override
# < a standalone prom_srv_cfg_nodes entry. Resolved into prom_srv_cfg_nodes_resolved
# by tasks/resolve_nodes.yml before targets/scrape configs are templated.
#
# A kind's jobs (the exporters that scrape a device of that kind) resolve
# separately: prom_srv_cfg_kind_defaults.<kind>.job_defaults applies to every job
# under that kind, prom_srv_cfg_kind_defaults.<kind>.jobs.<job> overrides it per
# job. Resolved into prom_srv_cfg_device_jobs_resolved (one row per device x job,
# for targets) and prom_srv_cfg_jobs_resolved (one row per job, for scrape configs).
prom_srv_cfg_kind_defaults: {}
prom_srv_cfg_service_defaults: {}
prom_srv_cfg_node_sets: {}
prom_srv_cfg_nodes: []

prom_srv_cfg_cleanup: false
