---
- name: Assert every device has the required labels
  ansible.builtin.assert:
    that:
      - item.value.labels is defined
      - item.value.labels is mapping
      - prom_srv_cfg_required_labels | difference(item.value.labels.keys() | list) | length == 0
    fail_msg: >-
      Device {{ item.key }} is missing required labels:
      {{ prom_srv_cfg_required_labels | difference(item.value.labels.keys() | list) }}
    quiet: true
  loop: "{{ prom_srv_cfg_devices | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Assert every device declares at least one exporter
  ansible.builtin.assert:
    that:
      - item.value.exporters is defined
      - item.value.exporters | length > 0
    fail_msg: "Device {{ item.key }} declares no exporters"
    quiet: true
  loop: "{{ prom_srv_cfg_devices | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

