---
- name: Create Prometheus config directories
  ansible.builtin.file:
    path: "{{ prom_srv_dir }}/etc/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - scrape_configs
    - rules
    - targets

- name: Install Prometheus main config
  ansible.builtin.template:
    src: etc/prometheus.yml.j2
    dest: "{{ prom_srv_dir }}/etc/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Prometheus

- name: Resolve per-device and per-job labels
  import_tasks: resolve_nodes.yml

- name: Install Prometheus scrape configs
  ansible.builtin.template:
    src: "etc/scrape_configs/{{ prom_srv_cfg_scrape_config_set }}/{{ item }}.j2"
    dest: "{{ prom_srv_dir }}/etc/scrape_configs/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ prom_srv_cfg_scrape_configs }}"
  notify: Reload Prometheus

- name: Install Prometheus rules
  ansible.builtin.copy:
    src: "etc/rules/{{ item }}"
    dest: "{{ prom_srv_dir }}/etc/rules/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ prom_srv_cfg_rules }}"
  notify: Reload Prometheus

- name: Install Prometheus targets
  ansible.builtin.template:
    src: "etc/targets/{{ prom_srv_cfg_target_set }}/{{ item }}.j2"
    dest: "{{ prom_srv_dir }}/etc/targets/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ prom_srv_cfg_targets }}"
  notify: Reload Prometheus
