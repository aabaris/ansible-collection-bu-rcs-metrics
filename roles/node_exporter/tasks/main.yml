---
- name: Fetch node_exporter to the controller cache
  run_once: true
  delegate_to: localhost
  become: false
  block:
    - name: Create controller cache directory
      ansible.builtin.file:
        path: "{{ node_exporter_cache_dir }}"
        state: directory
        mode: "0755"

    - name: Download node_exporter tarball
      ansible.builtin.get_url:
        url: "{{ _url }}/{{ _tarball }}"
        dest: "{{ node_exporter_cache_dir }}/{{ _tarball }}"
        checksum: "sha256:{{ _url }}/sha256sums.txt"
        mode: "0644"
      vars:
        _url: "{{ node_exporter_base_url }}/v{{ node_exporter_version }}"
        _tarball: "node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"

    - name: Extract node_exporter binary
      ansible.builtin.unarchive:
        src: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}.tar.gz"
        dest: "{{ node_exporter_cache_dir }}"
        remote_src: true
        creates: "{{ _extracted }}"
      vars:
        _extracted: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"

- name: Create nodde_exporter service top level directories
  ansible.builtin.file:
    path: "{{ item.dir }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { dir:  "/opt/node_exporter" }

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /sbin/nologin
    home: /
    create_home: false

- name: Create textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: "{{ node_exporter_user }}"
    mode: "0750"

- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ node_exporter_cache_dir }}/node_exporter-{{ node_exporter_version }}.{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Install node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
